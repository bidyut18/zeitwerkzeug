[project]
name = "zeitwerkzeug"
version = "0.0.5"
description = "Contextual time handling for Python: solar geometry, environmental conditions, human rhythms, and drifting schedules."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bidyut Mahanta", email = "bidyutmahanta7768@outlook.com" }]

dependencies = ["aiosqlite>=0.22.1", "tzdata>=2024.1; sys_platform == 'win32'"]

keywords = ["time", "scheduler", "timezone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Homepage = "https://github.com/bidyut18/zeitwerkzeug"
Repository = "https://github.com/bidyut18/zeitwerkzeug"
Issues = "https://github.com/bidyut18/zeitwerkzeug/issues"

[project.optional-dependencies]
weather = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5",
    "hypothesis>=6.90.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=zeitwerkzeug --cov-fail-under=80 --cov-report=term-missing"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["D"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
mypy_path = "src"
packages = ["zeitwerkzeug"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.coverage.run]
branch = true
source = ["zeitwerkzeug"]

[tool.coverage.report]
show_missing = true
skip_covered = false
