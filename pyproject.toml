

[project]
name = "zeitwerkzeug"
version = "0.0.1"
description = "Contextual time handling for Python: solar geometry, environmental conditions, human rhythms, and drifting schedules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bidyut Mahanta", email = "bidyutmahanta7768@outlook.com" }]


dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

keywords = [
    "time",
    "sunrise",
    "sunset",
    "scheduler",
    "cron",
    "astro",
    "context",
    "personas",
    "async",
]
classifiers = [
    "Development Status :: 4 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bidyutmahanta/zeitwerkzeug"
Repository = "https://github.com/bidyutmahanta/zeitwerkzeug"
Issues = "https://github.com/bidyutmahanta/zeitwerkzeug/issues"


[project.optional-dependencies]
weather = ["httpx>=0.27"]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
# Local development dependencies (PEP 735 - Used by `uv` and modern pip)
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

# --- Tool Configurations ---

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
mypy_path = "src"
packages = ["zeitwerkzeug"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.coverage.run]
branch = true
source = ["zeitwerkzeug"]

[tool.coverage.report]
show_missing = true
skip_covered = false
