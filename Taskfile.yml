version: "3"
vars:
  MYPY_TARGET: src

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  install:
    desc: Install the package with all dependencies (dev + extras)
    cmds:
      - uv sync --all-extras --dev

  lint:
    desc: Run lint checks with Ruff
    cmds:
      - uv run ruff check .

  "lint:fix":
    desc: Automatically fix lint issues with Ruff
    cmds:
      - uv run ruff check --fix .

  format:
    desc: Format code with Ruff
    cmds:
      - uv run ruff format .

  "format:check":
    desc: Check formatting without modifying files
    cmds:
      - uv run ruff format --check .

  typecheck:
    desc: Run static type checking with mypy
    cmds:
      - uv run mypy {{.MYPY_TARGET}}

  test:
    desc: Run tests with pytest (coverage configured in pyproject.toml)
    cmds:
      - uv run pytest

  check:
    desc: Run full local CI check
    cmds:
      - task: lint
      - task: "format:check"
      - task: typecheck
      - task: test

  clean:
    desc: Remove caches, build artifacts, and temporary files
    cmds:
      - |
        uv run python -c "
        import shutil, pathlib
        targets = ['.pytest_cache', '.mypy_cache', '.ruff_cache', 'htmlcov', 'dist', 'build', 'coverage.xml', '.coverage']
        for p in [pathlib.Path(t) for t in targets]:
            if p.is_dir():
                shutil.rmtree(p, ignore_errors=True)
            else:
                p.unlink(missing_ok=True)
        for p in sorted(pathlib.Path('.').rglob('__pycache__'), key=lambda x: len(x.parts), reverse=True):
            if p.is_dir():
                shutil.rmtree(p, ignore_errors=True)
        for p in sorted(pathlib.Path('src').rglob('*.egg-info'), key=lambda x: len(x.parts), reverse=True):
            if p.is_dir():
                shutil.rmtree(p, ignore_errors=True)
        "

  dist:
    desc: Build source and wheel distributions using uv
    cmds:
      - uv build

  publish:
    desc: Publish package to PyPI using uv (requires Trusted Publishing setup)
    cmds:
      - uv publish

  "publish:test":
    desc: Publish to Test PyPI (requires token or trusted publishing)
    cmds:
      - uv publish --publish-url https://test.pypi.org/legacy/