version: "3"

vars:
  MYPY_TARGET: src

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  install:
    desc: Install the package with development dependencies
    cmds:
      - python -m pip install --upgrade pip
      - pip install -e ".[dev]"

  install:uv:
    desc: Install with uv instead of pip
    cmds:
      - uv venv
      - uv pip install -e ".[dev]"

  lint:
    desc: Run lint checks with Ruff
    cmds:
      - ruff check .

  lint:fix:
    desc: Automatically fix lint issues with Ruff
    cmds:
      - ruff check --fix .

  format:
    desc: Format code with Ruff
    cmds:
      - ruff format .

  format:check:
    desc: Check formatting without modifying files
    cmds:
      - ruff format --check .

  typecheck:
    desc: Run static type checking with mypy
    cmds:
      - mypy {{.MYPY_TARGET}}

  test:
    desc: Run tests with pytest
    cmds:
      - pytest

  coverage:
    desc: Run tests with coverage reporting
    cmds:
      - pytest --cov --cov-report=term-missing

  precommit:
    desc: Run pre-commit hooks against all files
    cmds:
      - pre-commit run --all-files

  check:
    desc: Run lint and type checking
    cmds:
      - task: lint
      - task: typecheck

  ci:
    desc: Full local CI check
    cmds:
      - task: lint
      - task: format:check
      - task: typecheck
      - task: test

  clean:
    desc: Remove caches, build artifacts, and temporary files
    cmds:
      - |
        python -c "import shutil,pathlib; targets=['.pytest_cache','.mypy_cache','.ruff_cache','htmlcov','dist','build','coverage.xml','.coverage']; [shutil.rmtree(p, ignore_errors=True) if p.is_dir() else p.unlink(missing_ok=True) for p in [pathlib.Path(t) for t in targets]]; [shutil.rmtree(p, ignore_errors=True) for p in sorted(pathlib.Path('.').rglob('__pycache__'), key=lambda x: len(x.parts), reverse=True) if p.is_dir()]; [shutil.rmtree(p, ignore_errors=True) for p in sorted(pathlib.Path('src').rglob('*.egg-info'), key=lambda x: len(x.parts), reverse=True) if p.is_dir()]"
