name: Publish Python Package

on:
  push:
    branches: ["release"]
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test-build:
    name: Test installed package
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download distributions artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Install built package
        run: uv pip install --system dist/*.whl || uv pip install --system dist/*.tar.gz

      - name: Install test dependencies
        run: uv sync --upgrade --all-extras

      - name: Smoke test import
        run: |
          uv run python -c "import zeitwerkzeug; print(zeitwerkzeug.__version__)"

      - name: Run tests against installed package
        run: |
          uv run pytest tests/ --cov=zeitwerkzeug --cov-report=term-missing

  publish:
    name: Publish to PyPI
    needs: [build, test-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zeitwerkzeug
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distributions artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Publish to PyPI
        run: uv publish
