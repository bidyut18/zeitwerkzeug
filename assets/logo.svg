<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Matte Charcoal Background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="40" fill="url(#bg)"/>

  <!-- Background Grid Mesh -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.08">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>

    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- Major Solar Orbital Ellipses (Perspective View) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <!-- Main Solar Trajectory Ring -->
    <ellipse cx="256" cy="256" rx="190" ry="110" stroke-width="1.5" transform="rotate(-25 256 256)" opacity="0.85"/>
    <!-- Secondary Horizon Ring -->
    <ellipse cx="256" cy="256" rx="190" ry="60" stroke-width="0.8" stroke-dasharray="4 8" transform="rotate(15 256 256)" opacity="0.4"/>
    <!-- Inner Altitude Arc -->
    <ellipse cx="256" cy="256" rx="120" ry="70" stroke-width="1" stroke-dasharray="12 4 2 4" transform="rotate(-25 256 256)" opacity="0.6"/>
  </g>

  <!-- Intersecting Tangent & Angle Vectors -->
  <g stroke="#ffffff" stroke-width="0.75" opacity="0.5">
    <line x1="80" y1="340" x2="432" y2="170"/>
    <line x1="140" y1="110" x2="370" y2="402"/>
    <line x1="256" y1="60" x2="256" y2="452" stroke-dasharray="2 6"/>
  </g>

  <!-- Secondary Anchor Nodes & Circles -->
  <!-- Left Node (Dawn Anchor) -->
  <circle cx="150" cy="210" r="28" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
  <circle cx="150" cy="210" r="14" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="150" cy="210" r="4" fill="#ffffff" filter="url(#node-glow)"/>

  <!-- Right Node System (Solar Zenith / Execution Pivot) -->
  <circle cx="340" cy="280" r="42" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
  <circle cx="340" cy="280" r="24" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="340" cy="280" r="12" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="3 3"/>
  <circle cx="340" cy="280" r="5" fill="#ffffff" filter="url(#node-glow)"/>

  <!-- Top Solar Primary Node -->
  <circle cx="215" cy="132" r="8" fill="#ffffff" filter="url(#node-glow)"/>
  <circle cx="215" cy="132" r="16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

  <!-- Connection Triangulation Lines -->
  <polygon points="150,210 215,132 340,280" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>

  <!-- Telemetry Micro-Data Text Callouts -->
  <g fill="#ffffff" font-family="monospace" font-size="8" opacity="0.65">
    <text x="52" y="70" font-weight="bold" opacity="0.9">ZEITWERKZEUG // SYS.01</text>
    <text x="52" y="84">SOL.ALT : +04.2°</text>
    <text x="52" y="96">AZIMUTH : 135.5020</text>

    <text x="350" y="420" text-anchor="end">LAT 52.5200 // LON 13.4050</text>
    <text x="350" y="432" text-anchor="end">REF: WAKE_TIME + 02:00</text>
    <text x="350" y="444" font-weight="bold" opacity="0.9">STATUS: LAZY_RESOLVED</text>
  </g>

  <!-- Peripheral Coordinate Markers -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="52" cy="444" r="2"/>
    <circle cx="60" cy="444" r="2"/>
    <circle cx="68" cy="444" r="2"/>
    <line x1="420" y1="70" x2="450" y2="70" stroke="#ffffff" stroke-width="1"/>
    <line x1="450" y1="70" x2="450" y2="100" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>
